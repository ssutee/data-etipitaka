[project]
name = "etipitaka-mcp"
version = "0.1.0"
description = "MCP server exposing E-Tipitaka personal data and canon search."
requires-python = ">=3.11"
# mcp pinned <2: this server targets the v1 FastMCP API
# (mcp.server.fastmcp.FastMCP), which mcp 2.x removed/renamed to MCPServer.
dependencies = ["mcp>=1.2.0,<2", "httpx>=0.27", "uvicorn>=0.30"]

[project.optional-dependencies]
keyring = ["keyring>=25"]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[project.scripts]
etipitaka-mcp = "etipitaka_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
