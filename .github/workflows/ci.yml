name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # manual "Run workflow" — the production deploy gate

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: etipitaka_data
          POSTGRES_USER: etipitaka
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: etipitaka_data
      SQL_USER: etipitaka
      SQL_PASSWORD: testpass
      SQL_HOST: localhost
      SQL_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt
      - name: Run unit tests with coverage
        working-directory: app
        run: python -m pytest

  golden-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.ci .env
          cp .env.db.ci .env.db
          # The ./media bind mount must be writable by the container's
          # app user (uid 999); a fresh runner creates it root-owned.
          mkdir -p media && sudo chown 999:999 media
          docker compose up -d --build
      - name: Wait for the app
        run: |
          docker compose exec -T web python manage.py migrate --noinput
          for i in $(seq 1 30); do
            if curl -sf http://localhost:1338/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "app did not come up"; docker compose logs; exit 1
      - name: Seed and run the golden harness
        run: |
          docker compose exec -T web python manage.py seed_golden
          pip install -r tests/golden/requirements.txt
          python -m pytest tests/golden -v --base-url http://localhost:1338

  deploy:
    needs: [unit-tests, golden-harness]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only && ./deploy.sh"
