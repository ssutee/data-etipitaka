<div>
<form class="form-horizontal" id="signup" role="form">
  <div class="form-group row">
    <label for="email" class="col-sm-2 control-label">Email</label>
    <div class="col-sm-6">
      <input required ng-model="inputForm.email" name="email" type="email" class="form-control" id="email" placeholder="Email">
    </div>
    <span class="col-sm-4" class="error-msg"><[error.email]></span>
  </div>

  <div class="form-group row">
    <label for="username" class="col-sm-2 control-label">Username</label>
    <div class="col-sm-6">
      <input required ng-model="inputForm.username" name="username" type="text" class="form-control" id="username" placeholder="Username">
    </div>
    <span class="col-sm-4" class="error-msg"><[error.username]></span>
  </div>

  <div class="form-group row">
    <label for="password1" class="col-sm-2 control-label">Password</label>
    <div class="col-sm-6">
      <input required ng-model="inputForm.password1" name="password1" type="password" class="form-control" id="password1" placeholder="Password">
    </div>
  </div>

  <div class="form-group row">
    <label for="password2" class="col-sm-2 control-label">Repeat password</label>
    <div class="col-sm-6">
      <input required ng-model="inputForm.password2" name="password2" type="password" class="form-control" id="password2" placeholder="Repeat password">
    </div>
    <span class="col-sm-4" class="error-msg"><[error.password]></span>
  </div>

  <div class="form-group row">
    <div class="col-sm-offset-2 col-sm-10">
      <button type="submit" class="btn btn-default" ng-click="signup('{% url 'rest_auth:rest_register' %}')">Sign up</button>
    </div>
  </div>
</form>
</div>
