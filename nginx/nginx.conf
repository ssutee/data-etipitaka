# Prefer a scheme forwarded by the proxy in front of us; fall back to this
# proxy's own (plain HTTP -- a host-level TLS terminator sits in front of
# this container in production and is expected to set this unconditionally).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Recover the real client IP only from private-range peers (the host proxy
# and the docker bridge network) so per-client rate-limit buckets below key
# on the actual client, not the proxy in front -- and so a client reaching
# this port directly with a spoofed X-Forwarded-For cannot pick its bucket.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Unauthenticated /mcp traffic costs a Django round trip plus DB queries,
# because rejected tokens are deliberately never cached.
limit_req_zone $binary_remote_addr zone=mcp_rl:10m rate=10r/s;
# Dynamic client registration is open; a client registers once, rarely.
limit_req_zone $binary_remote_addr zone=dcr_rl:10m rate=6r/m;
# A legitimate client hits /o/token/ once per authorization and once per
# refresh -- not a high-frequency endpoint -- so an unbounded loop here is
# purely abuse (minting tokens, growing the token tables without limit).
limit_req_zone $binary_remote_addr zone=token_rl:10m rate=30r/m;
# /api/oauth/verify/ is what the /mcp rate limit above exists to protect
# (the MCP container calls it on every tool call over the internal docker
# network, bypassing this proxy entirely) but it is also directly reachable
# here, unmetered, which lets that protection be routed around. Mirror the
# /mcp limit so direct traffic cannot cost more than going through /mcp would.
limit_req_zone $binary_remote_addr zone=verify_rl:10m rate=10r/s;
# Passkey ceremonies (anonymous login/signup begin+finish) and browser
# passkey login/recovery are anonymous and each writes a challenge row.
# Loose enough to absorb carrier-grade NAT and large offices sharing one
# public IP, and the login page's own conditional-mediation autofill
# (passkey_login.js's startAutofill(): one login/begin per page view, plus
# a refresh every 270s for every tab left open -- roughly 14 requests/hour
# for a single idle tab). Credential guessing itself is already stopped by
# single-use challenges, required user verification and the DRF-level
# PasskeyRateThrottle; this zone only needs to stop flooding.
limit_req_zone $binary_remote_addr zone=passkey_rl:10m rate=60r/m;
# Signed-in passkey management (list/rename/delete an existing passkey, add
# a new one, remove the password fallback) is authenticated, so it is not
# the same abuse surface as the anonymous ceremonies above -- but a single
# page-open-plus-add sequence is already ~4 requests, and each add ceremony
# carries a short-lived WebAuthn challenge, so the rate must stay loose
# enough, and nodelay (not paced), that ordinary use never queues into an
# expired challenge.
limit_req_zone $binary_remote_addr zone=passkey_manage_rl:10m rate=60r/m;
# Desktop pairing polls every 5s for up to PASSKEY_DESKTOP_TTL, so sustained
# traffic rather than the login ceremonies' two-shot bursts. Sits deliberately
# ABOVE the DRF 'passkey_desktop' scope (90/min) so DRF stays the limit that
# actually shapes client behaviour and this is only the edge backstop.
limit_req_zone $binary_remote_addr zone=passkey_desktop_rl:10m rate=120r/m;
# reset_get_rl/reset_post_rl (below) are intentionally method-aware.
# /password_reset/ and the two-hop /reset/<uidb64>/<token-or-set-password>/
# confirm flow are reached by plain browser navigation, and Django's own
# PasswordResetConfirmView 302s a real token straight to .../set-password/
# before ever rendering the form -- so one legitimate recovery is already
# GET (the email link), GET (that redirect's target), POST, and a single
# shared budget for all three left almost nothing for the POST that
# actually matters (mailing an address, or setting a password). A single
# limit_req_zone can't vary its rate by method, so each zone's key is
# empty -- meaning "don't limit this request" -- for the method it doesn't
# apply to.
map $request_method $reset_get_key {
    GET     $binary_remote_addr;
    HEAD    $binary_remote_addr;
    default "";
}
map $request_method $reset_post_key {
    POST    $binary_remote_addr;
    default "";
}
# Retry-After for @ratelimited_reset below, matched to whichever of the two
# zones a given request can actually exhaust -- a GET only ever draws from
# reset_get_rl, a POST only from reset_post_rl.
map $request_method $reset_retry_after {
    POST    12;
    default 3;
}
# Navigational GETs: the email link itself, its redirect to .../set-password/,
# mail-gateway link prefetch, and more than one person behind the same NAT
# opening the same email.
limit_req_zone $reset_get_key zone=reset_get_rl:10m rate=20r/m;
# The two POSTs that do something: /password_reset/ mails whatever address
# is submitted (unauthenticated email amplification) and
# /reset/<uidb64>/set-password/ actually sets the new password -- together
# the only controls on reset-link brute force. A legitimate recovery is
# exactly two of these.
limit_req_zone $reset_post_key zone=reset_post_rl:10m rate=5r/m;
limit_req_status 429;

upstream app {
    server web:8000;
}

upstream mcp {
    server mcp:8001;
    keepalive 32;
}

server {

    listen 80;

    client_max_body_size 0;

    location / {
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Dynamic client registration (RFC 7591) is open to anyone; rate-limit
    # registration itself. Regex (not exact match) so this covers both
    # POST /o/register/ and /o/register (Django 301s the slash-less form,
    # but that redirect is otherwise unmetered), while still sparing the
    # per-client management URLs nested beneath it, e.g. /o/register/<id>/,
    # which this pattern does not match.
    location ~ ^/o/register/?$ {
        limit_req zone=dcr_rl burst=5 nodelay;
        error_page 429 = @ratelimited_dcr;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Token endpoint (authorization_code exchange + refresh_token) is open to
    # anyone with a code or refresh token; rate-limit it so it cannot be used
    # to mint tokens in a loop. Regex (not exact match) for the same reason
    # as /o/register/ above: covers both /o/token/ and the slash-less form.
    location ~ ^/o/token/?$ {
        limit_req zone=token_rl burst=5 nodelay;
        error_page 429 = @ratelimited_token;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Resource-server token check (see the verify_rl zone comment above).
    location = /api/oauth/verify/ {
        limit_req zone=verify_rl burst=20 nodelay;
        error_page 429 = @ratelimited_verify;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Browser passkey login: POST-only (passkey_web_views.login_passkey is
    # @require_POST) -- the login PAGE itself is /login/, served unmetered
    # by location / above. Regex (not exact match), with the trailing slash
    # optional, so this also covers the slash-less POST -- Django's
    # APPEND_SLASH 301 to the same path would otherwise go through that
    # unmetered location /, same reasoning as /o/register/?$ above.
    location ~ ^/login/passkey/?$ {
        limit_req zone=passkey_rl burst=30 nodelay;
        error_page 429 = @ratelimited_passkey;
        # WebAuthn ceremony bodies (options + a signed assertion) are small
        # JSON; cap well below Django's own upload limits instead of
        # inheriting the unbounded client_max_body_size 0 above.
        client_max_body_size 64k;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Desktop pairing confirmation page (the signed-in browser leg of the
    # handshake -- see user_data/desktop_pairing.py). Plain Django views, so
    # unlike the /api/passkeys/ endpoints no DRF throttle backs this up: nginx
    # is the only limiter, and /desktop/approve/ writes to the database.
    # 60r/m is ample for a human pressing one button.
    location ~ ^/desktop/ {
        limit_req zone=passkey_rl burst=30 nodelay;
        error_page 429 = @ratelimited_passkey;
        client_max_body_size 64k;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Passkey account-recovery ceremony (anonymous, reached only from a
    # valid password-reset-confirm session -- see user_data/recovery.py).
    location ~ ^/account/recover/passkey/ {
        limit_req zone=passkey_rl burst=30 nodelay;
        error_page 429 = @ratelimited_passkey;
        client_max_body_size 64k;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Anonymous passkey login/signup ceremonies (begin+finish, ~2 requests
    # per attempt). Listed ahead of the general /api/passkeys/ location
    # below so this more specific regex wins -- nginx evaluates regex
    # locations in the order they appear in this file and stops at the
    # first match.
    location ~ ^/api/passkeys/(login|signup)/ {
        limit_req zone=passkey_rl burst=30 nodelay;
        error_page 429 = @ratelimited_passkey;
        client_max_body_size 64k;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Anonymous desktop pairing (begin once, then poll every 5s for the life
    # of the pairing). Listed ahead of the general /api/passkeys/ location
    # below so this more specific regex wins.
    location ~ ^/api/passkeys/desktop/ {
        limit_req zone=passkey_desktop_rl burst=60 nodelay;
        error_page 429 = @ratelimited_passkey;
        client_max_body_size 64k;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Signed-in passkey management: list/rename/delete, register a new
    # passkey (with password or passkey step-up), remove the password
    # fallback. Looser than the anonymous ceremonies above and nodelay'd,
    # for the reason given on passkey_manage_rl above. `(/|$)`, not a bare
    # trailing slash, so the slash-less GET /api/passkeys (APPEND_SLASH
    # would otherwise send through the unmetered location / below) is
    # caught too -- same care as /login/passkey/?$ above.
    location ~ ^/api/passkeys(/|$) {
        limit_req zone=passkey_manage_rl burst=20 nodelay;
        error_page 429 = @ratelimited_passkey_manage;
        client_max_body_size 64k;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Password-reset request and the reset-confirm flow (see
    # reset_get_rl/reset_post_rl above). Matches /password_reset/,
    # /reset/<uidb64>/<token>/ and the /reset/<uidb64>/set-password/ page
    # PasswordResetConfirmView redirects a valid token to before rendering
    # the form -- all the same "reset/<a>/<b>/" shape -- while
    # /password_reset/done/ and /reset/done/ (one segment, not two) stay
    # unmetered, since they are harmless post-completion pages, not part of
    # this attack surface. Two limit_req directives, not one: see
    # reset_get_rl/reset_post_rl's own comment for why this zone is
    # method-aware.
    location ~ ^/(password_reset/?|reset/[^/]+/[^/]+/?)$ {
        limit_req zone=reset_get_rl burst=10 nodelay;
        limit_req zone=reset_post_rl burst=3 nodelay;
        error_page 429 = @ratelimited_reset;
        client_max_body_size 64k;
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Remote MCP endpoint (Streamable HTTP holds long-lived responses/SSE).
    location /mcp {
        limit_req zone=mcp_rl burst=20 nodelay;
        error_page 429 = @ratelimited_mcp;
        # The MCP SDK itself caps request bodies at 4 MiB; reject oversized
        # bodies at the edge instead of inheriting the global unlimited
        # client_max_body_size 0 (which exists for Django's own uploads).
        client_max_body_size 4m;
        proxy_pass http://mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
    }

    # Give a throttled client something machine-readable to act on (RFC 6585
    # SHOULD send Retry-After on 429) instead of nginx's stock HTML error
    # page, which a JSON-RPC client mid-session cannot parse. Each zone gets
    # its own handler so Retry-After matches that zone's refill rate: mcp_rl
    # refills at 10r/s (one token every 1s), dcr_rl at 6r/m (one token every
    # 10s) -- a shared 1s hint would have registration clients retrying
    # roughly ten times before one succeeded.
    location @ratelimited_mcp {
        add_header Retry-After 1 always;
        default_type application/json;
        return 429 '{"error":"rate_limited","retry_after":1}';
    }

    location @ratelimited_dcr {
        add_header Retry-After 10 always;
        default_type application/json;
        return 429 '{"error":"rate_limited","retry_after":10}';
    }

    # token_rl refills at 30r/m (one token every 2s); verify_rl mirrors
    # mcp_rl at 10r/s (one token every 1s).
    location @ratelimited_token {
        add_header Retry-After 2 always;
        default_type application/json;
        return 429 '{"error":"rate_limited","retry_after":2}';
    }

    location @ratelimited_verify {
        add_header Retry-After 1 always;
        default_type application/json;
        return 429 '{"error":"rate_limited","retry_after":1}';
    }

    # passkey_rl refills at 60r/m (one token every 1s). "detail" is
    # additive alongside the existing "error"/"retry_after" keys -- it
    # matches the {"detail": "..."} shape every other error response from
    # these same endpoints already uses, for any client (native app or
    # passkey.js) that just displays that field generically; passkey.js
    # itself special-cases status 429 with a friendlier, retry_after-aware
    # message (see errorMessage() in assets/passkey.js).
    location @ratelimited_passkey {
        add_header Retry-After 1 always;
        default_type application/json;
        return 429 '{"error":"rate_limited","retry_after":1,"detail":"Too many requests. Please wait a moment and try again."}';
    }

    # passkey_manage_rl refills at 60r/m (one token every 1s). See
    # @ratelimited_passkey above for why "detail" is included.
    location @ratelimited_passkey_manage {
        add_header Retry-After 1 always;
        default_type application/json;
        return 429 '{"error":"rate_limited","retry_after":1,"detail":"Too many requests. Please wait a moment and try again."}';
    }

    # reset_get_rl refills at 20r/m (one token every 3s); reset_post_rl at
    # 5r/m (one token every 12s) -- $reset_retry_after (defined above)
    # picks whichever applies to this request's method. Unlike every other
    # 429 handler on this page, this one is reached by a browser following
    # an emailed link, not by passkey.js's fetch() calls -- a passkey-only
    # user who lost their device and hit this while recovering must not be
    # shown a raw JSON blob as the page, so this renders a small HTML page
    # instead.
    location @ratelimited_reset {
        add_header Retry-After $reset_retry_after always;
        default_type text/html;
        return 429 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Please wait</title></head><body><h1>Too many attempts</h1><p>You have followed this link too many times in a row. Please wait a moment, then try the link from your email again.</p></body></html>';
    }

    # RFC 9728 protected-resource metadata is published by the MCP service.
    location /.well-known/oauth-protected-resource {
        proxy_pass http://mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /static/ {
        alias /home/app/web/static/;
    }

    location /media/ {
        alias /home/app/web/media/;
    }

}
