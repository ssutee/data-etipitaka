services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: gunicorn etipitaka_auth.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4
    volumes:
      - ./app:/home/app/web
      - static_volume:/home/app/web/static
      - ./media:/home/app/web/media
    expose:
      - 8000
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
  mcp:
    build:
      context: ./mcp_server
    expose:
      - 8001
    environment:
      ETIPITAKA_TRANSPORT: http
      # Internal Django for verify + API calls; public URLs for OAuth metadata.
      ETIPITAKA_BASE_URL: http://web:8000
      ETIPITAKA_ISSUER_URL: https://data.etipitaka.com
      ETIPITAKA_RESOURCE_URL: https://data.etipitaka.com/mcp
      # nginx forwards the original Host header; allow prod + local dev/golden.
      ETIPITAKA_ALLOWED_HOSTS: data.etipitaka.com,data.etipitaka.com:*,localhost:*,127.0.0.1:*
    depends_on:
      - web
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/.well-known/oauth-protected-resource/mcp')\""]
      interval: 5s
      timeout: 5s
      retries: 10
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  nginx:
    build: ./nginx
    volumes:
      - static_volume:/home/app/web/static
      - ./media:/home/app/web/media
    ports:
      - 1338:80
    depends_on:
      web:
        condition: service_started
      mcp:
        condition: service_started

volumes:
  postgres_data:
  static_volume:
